name: Feature request
description: Something the editor or its API should be able to do
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What you are trying to do and why the current API gets in the way.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposal
      description: How you would like it to work, if you have an idea.
