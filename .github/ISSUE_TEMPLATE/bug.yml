name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The smallest config and keys that show the problem.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: Output of `gau --version` or the commit you built.
    validations:
      required: true
  - type: input
    attributes:
      label: OS and terminal
      placeholder: macOS 15, Ghostty
