[workspace]
resolver = "3"
members = [
  "gauchito-core",
  "gauchito-ui",
  "gauchito-script",
  "gauchito-cli",
]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "MIT"
repository = "https://github.com/smartinellimarco/gauchito"
homepage   = "https://github.com/smartinellimarco/gauchito"

[workspace.dependencies]
gauchito-core   = { path = "gauchito-core", version = "0.1.0" }
gauchito-ui     = { path = "gauchito-ui", version = "0.1.0" }
gauchito-script = { path = "gauchito-script", version = "0.1.0" }
ropey           = "2.0.0-beta.1"
tokio           = { version = "1", features = ["full"] }

[profile.release]
lto           = true
codegen-units = 1
strip         = true

[profile.dist]
inherits = "release"
